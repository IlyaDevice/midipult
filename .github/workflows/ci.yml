name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static checks (including secret guard)
        run: python tests/static_checks.py
      - name: Unit tests
        run: python tests/test_units.py
