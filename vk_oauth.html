<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>VK — вход в MidiPult</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    color:#f5f7ff;background:radial-gradient(120% 100% at 50% 0%,#1b2340,#070a12 60%)}
  .card{width:min(100%,360px);padding:24px;border-radius:20px;text-align:center;
    border:1px solid rgba(255,255,255,.12);background:rgba(17,24,39,.88);
    box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .badge{width:54px;height:54px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;
    font:800 20px/1 "Inter",sans-serif;background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#fff}
  h1{margin:0 0 8px;font-size:20px;letter-spacing:-.02em}
  p{margin:0;color:#9aa4b8;font-size:13px;line-height:1.45}
  button{margin-top:18px;width:100%;height:44px;border:0;border-radius:12px;cursor:pointer;
    font:600 14px "Inter",sans-serif;color:#10131c;background:#f5f7ff}
  button[hidden]{display:none}
</style>
</head>
<body>
  <main class="card">
    <div class="badge">VK</div>
    <h1>Вход VK</h1>
    <p id="status">Завершаю вход…</p>
    <button id="close" type="button" hidden>Вернуться в панель</button>
  </main>
<script>
(function () {
  var status = document.getElementById('status');
  var close = document.getElementById('close');
  var params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  var token = params.get('access_token') || '';
  var state = params.get('state') || '';
  var error = params.get('error_description') || params.get('error') || '';

  function finish(text, ok) {
    status.textContent = text;
    close.hidden = false;
    close.addEventListener('click', function () {
      if (window.opener) window.close();
      else location.replace('/');
    });
    if (ok) setTimeout(function () {
      try { window.close(); } catch (e) {}
    }, 700);
  }

  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  if (error) {
    finish('VK не пустил: ' + error, false);
    return;
  }
  if (!token || state !== 'vk_oauth') {
    finish('Не удалось получить токен. Вернитесь в панель и попробуйте снова.', false);
    return;
  }

  try {
    localStorage.setItem('mypult-vk-oauth', JSON.stringify({token: token, at: Date.now()}));
  } catch (e) {}

  if (window.opener) {
    try {
      window.opener.postMessage({type: 'mipult-vk-oauth', token: token}, location.origin);
    } catch (e) {}
    finish('Готово. Закрываю окно…', true);
  } else {
    // Запасной путь, если браузер открыл вход в этой же вкладке.
    finish('Готово. Возвращаюсь в панель…', true);
    setTimeout(function () { location.replace('/'); }, 700);
  }
})();
</script>
</body>
</html>
